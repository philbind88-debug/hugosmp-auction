name: Mod bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Mod bauen
        run: gradle build

      - name: Fertige Mod hochladen
        uses: actions/upload-artifact@v4
        with:
          name: hugo-auction-mod
          path: build/libs/hugo-auction-1.0.0.jar
