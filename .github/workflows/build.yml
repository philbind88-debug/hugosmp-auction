name: Mod bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Mod bauen
        run: |
          gradle build --console=plain > build.log 2>&1 || {
            msg=$(grep -E "error:|What went wrong|Caused by|Could not|FAILED" -A3 build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build-Fehler::$msg"
            tail -40 build.log
            exit 1
          }

      - name: Fertige Mod hochladen
        uses: actions/upload-artifact@v4
        with:
          name: hugo-auction-mod
          path: build/libs/hugo-auction-1.0.0.jar
